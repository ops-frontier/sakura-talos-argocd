---
# push-infra-apps.yml – infra-apps Helm chart を OCI レジストリに push し、
# ArgoCD の app-of-apps targetRevision を新しいチャートバージョンに更新する
- name: Push infra-apps Helm chart to OCI registry
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/omni-kubeconfig.yaml
  roles:
    - terraform_outputs
    - push_infra_apps
  tasks:
    - block:
        - name: Fetch kubeconfig from Sidero Talos Omni
          ansible.builtin.include_role:
            name: omni_kubeconfig
          vars:
            omni_kubeconfig_dest: "{{ _local_kubeconfig }}"

        - name: Patch app-of-apps targetRevision
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ _local_kubeconfig }}"
              - patch
              - application
              - app-of-apps
              - -n
              - argocd
              - --type=merge
              - --patch
              - '{"spec":{"source":{"targetRevision":"{{ infra_apps_chart_version }}"}}}'
          changed_when: true

        - name: Show app-of-apps update completion
          ansible.builtin.debug:
            msg: "app-of-apps targetRevision → {{ infra_apps_chart_version }}"
      always:
        - name: Remove temporary kubeconfig
          ansible.builtin.file:
            path: "{{ _local_kubeconfig }}"
            state: absent
