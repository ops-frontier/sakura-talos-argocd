---
# push-infra-apps.yml – infra-apps Helm chart を OCI レジストリに push し、
# ArgoCD の app-of-apps targetRevision を新しいチャートバージョンに更新する
- name: Push infra-apps Helm chart to OCI registry
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/talos-kubeconfig.yaml
  roles:
    - terraform_outputs
    - get_my_ip
    - push_infra_apps
  tasks:
    - block:
        - name: Allow management APIs from the control host
          ops_frontier.provider.sakura_packet_filter:
            packet_filter_id: "{{ tf_outputs.packet_filter_id.value }}"
            state: present
            rule_type: tcp
            port: "{{ item }}"
            source_network: "{{ my_ip }}"
            api_base: "{{ sakura_api_base }}"
            token: "{{ sakura_access_token }}"
            secret: "{{ sakura_access_token_secret }}"
          loop:
            - "50000"
            - "6443"

        - name: Fetch kubeconfig through the Talos API
          ansible.builtin.include_role:
            name: talos_kubeconfig
          vars:
            talos_kubeconfig_dest: "{{ _local_kubeconfig }}"

        - name: Patch app-of-apps targetRevision
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ _local_kubeconfig }}"
              - patch
              - application
              - app-of-apps
              - -n
              - argocd
              - --type=merge
              - --patch
              - '{"spec":{"source":{"targetRevision":"{{ infra_apps_chart_version }}"}}}'
          changed_when: true

        - name: Show app-of-apps update completion
          ansible.builtin.debug:
            msg: "app-of-apps targetRevision → {{ infra_apps_chart_version }}"
      always:
        - name: Remove temporary kubeconfig
          ansible.builtin.file:
            path: "{{ _local_kubeconfig }}"
            state: absent
