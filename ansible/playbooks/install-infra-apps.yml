---
# install-infra-apps.yml – ArgoCD app-of-apps ブートストラップ (install-charts に相当)
#
# Talos Linux には SSH が存在しないため、kubeconfig の取得は
# Sidero Talos Omni の管理 API (omnictl) 経由で行う。
# Cilium (CNI) は Omni のクラスタ定義によりノード起動時に適用される。
# ArgoCD 本体はクラスタ Ready 後に公式 manifest からインストールする。
- name: Prepare facts and fetch kubeconfig from Omni
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/omni-kubeconfig.yaml
  roles:
    - terraform_outputs

  tasks:
    - name: Fetch kubeconfig from Sidero Talos Omni
      ansible.builtin.include_role:
        name: omni_kubeconfig
      vars:
        omni_kubeconfig_dest: "{{ _local_kubeconfig }}"

- name: Apply ArgoCD bootstrap manifests
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/omni-kubeconfig.yaml
    _argocd_install_manifest: /tmp/argocd-install.yaml
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ _local_kubeconfig }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ _local_kubeconfig }}"
    kubernetes.core.helm:
      kubeconfig: "{{ _local_kubeconfig }}"
  tasks:
    - block:
        - name: Create ArgoCD namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: argocd

        - name: Download ArgoCD install manifest
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/install.yaml
            dest: "{{ _argocd_install_manifest }}"
            mode: "0600"

        - name: Install ArgoCD
          kubernetes.core.k8s:
            state: present
            namespace: argocd
            src: "{{ _argocd_install_manifest }}"

        - name: Wait for ArgoCD to be ready
          ansible.builtin.include_role:
            name: wait_for_argocd

        - name: Push infra-apps to OCI registry
          ansible.builtin.include_role:
            name: push_infra_apps

        - name: Register ArgoCD OCI registry secret and app-of-apps
          ansible.builtin.include_role:
            name: register_argocd_apps

        - name: Apply ArgoCD manifests
          ansible.builtin.include_role:
            name: argocd_bootstrap
      always:
        - name: Remove temporary cluster files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ _local_kubeconfig }}"
            - "{{ _argocd_install_manifest }}"
