---
# install-infra-apps.yml – ArgoCD app-of-apps ブートストラップ (install-charts に相当)
#
# Talos Linux には SSH が存在しないため、kubeconfig は Talos API の
# mTLS 認証を使用して取得する。
# ArgoCD 本体はクラスタ Ready 後に公式 manifest からインストールする。
- name: Prepare facts and fetch kubeconfig from Talos
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/talos-kubeconfig.yaml
  roles:
    - terraform_outputs
    - get_my_ip

  tasks:
    - name: Allow management APIs from the control host
      ops_frontier.provider.sakura_packet_filter:
        packet_filter_id: "{{ tf_outputs.packet_filter_id.value }}"
        state: present
        rule_type: tcp
        port: "{{ item }}"
        source_network: "{{ my_ip }}"
        api_base: "{{ sakura_api_base }}"
        token: "{{ sakura_access_token }}"
        secret: "{{ sakura_access_token_secret }}"
      loop:
        - "50000"
        - "6443"

    - name: Fetch kubeconfig through the Talos API
      ansible.builtin.include_role:
        name: talos_kubeconfig
      vars:
        talos_kubeconfig_dest: "{{ _local_kubeconfig }}"

- name: Apply ArgoCD bootstrap manifests
  hosts: localhost
  gather_facts: false
  vars:
    _local_kubeconfig: /tmp/talos-kubeconfig.yaml
    _argocd_install_manifest: /tmp/argocd-install.yaml
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ _local_kubeconfig }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ _local_kubeconfig }}"
    kubernetes.core.helm:
      kubeconfig: "{{ _local_kubeconfig }}"
  tasks:
    - block:
        - name: Create ArgoCD namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: argocd

        - name: Download ArgoCD install manifest
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/install.yaml
            dest: "{{ _argocd_install_manifest }}"
            mode: "0600"

        - name: Install ArgoCD
          kubernetes.core.k8s:
            state: present
            namespace: argocd
            src: "{{ _argocd_install_manifest }}"

        - name: Wait for ArgoCD to be ready
          ansible.builtin.include_role:
            name: wait_for_argocd

        - name: Push infra-apps to OCI registry
          ansible.builtin.include_role:
            name: push_infra_apps

        - name: Register ArgoCD OCI registry secret and app-of-apps
          ansible.builtin.include_role:
            name: register_argocd_apps

        - name: Apply ArgoCD manifests
          ansible.builtin.include_role:
            name: argocd_bootstrap
      always:
        - name: Remove temporary cluster files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ _local_kubeconfig }}"
            - "{{ _argocd_install_manifest }}"
