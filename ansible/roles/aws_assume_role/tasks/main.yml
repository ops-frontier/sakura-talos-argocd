---
# aws_assume_role role – Switch Only なアクセスキー (環境変数 AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY にセットされている、AssumeRole 以外の権限を持たない
# IAM ユーザーのキー) から、AWS_ROLE_ARN のロールを一時的に AssumeRole し、
# 一時クレデンシャルを `aws_assumed_env` ファクト (dict) として設定する。
#
# 呼び出し側は、以降で aws コマンドを実行するタスクの `environment:` に
# `{{ aws_assumed_env }}` を指定することで、その一時クレデンシャルを使わせる。
# (このロール自身は環境変数を上書きしないため、既存の Switch Only キーは
#  そのまま維持される)

- name: Assume AWS IAM role for SSM operations
  ansible.builtin.command:
    cmd: >
      aws sts assume-role
      --role-arn {{ aws_role_arn }}
      --role-session-name ansible-ssm
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text
  register: _assume_role_result
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Set assumed-role credentials as environment dict
  ansible.builtin.set_fact:
    aws_assumed_env: "{{ dict(['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN'] | zip(_assume_role_result.stdout.split())) }}"
  run_once: true
