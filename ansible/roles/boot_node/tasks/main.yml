---
# boot_node role – Ubuntu → Talos Linux インストールの全工程
#
# 前提条件:
#   - tf_outputs ファクトが設定済み (terraform_outputs role を事前に実行)
#   - ansible_host が正しく設定済み (set_ansible_host role を事前に実行)
#   - my_ip ファクトが設定済み (get_my_ip role を事前に実行)
#   - omnictl media preset "talos-install" が作成済み (boot.yml の
#     localhost タスクで作成)
#
# Talos Linux には sshd が存在しないため、ターゲットディスク起動後の
# 状態確認や設定投入は SSH では行わない。ターゲットディスク上の Talos は
# 起動時に SideroLink 経由で能動的に Sidero Talos Omni へ接続し、
# マシン設定・Cilium・ArgoCD を自動的に取得・デプロイする。
# このロールが SSH を使用するのは Ubuntu ブートストラップディスクに
# 対してのみである。
#
# このロールは各サーバホストに対して実行される。
# Sakura API 呼び出しは delegate_to: localhost で行う。

# ---------------------------------------------------------------
# 1. サーバ情報取得・電源 ON
# ---------------------------------------------------------------
- name: Get server info from Sakura Cloud
  ops_frontier.provider.sakura_server_info:
    name: "{{ inventory_hostname }}"
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  register: _server_info
  delegate_to: localhost

- name: Power on server if currently down
  ops_frontier.provider.sakura_server_power:
    server_id: "{{ _server_info.server.id }}"
    state: on
    timeout: 120
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost
  when: _server_info.server.instance_status == "down"

# ---------------------------------------------------------------
# 2. 現在起動中のディスクを Sakura API のディスク順序から判定する
#    (Talos には sshd が無いため SSH では判定できない)
# ---------------------------------------------------------------
- name: Determine currently booted disk
  ansible.builtin.set_fact:
    _current_boot: >-
      {%- if _server_info.server.disks[0].name is match('.*-bootstrap$') -%}
      ubuntu
      {%- else -%}
      talos
      {%- endif -%}

# ---------------------------------------------------------------
# 3. Talos ターゲットディスクで起動中 → Ubuntu で再起動
# ---------------------------------------------------------------
- name: "[Talos] Power off to switch to Ubuntu"
  ops_frontier.provider.sakura_server_power:
    server_id: "{{ _server_info.server.id }}"
    state: off
    timeout: 300
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost
  when: _current_boot | trim == "talos"

- name: "[Talos] Refresh server info after shutdown"
  ops_frontier.provider.sakura_server_info:
    name: "{{ inventory_hostname }}"
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  register: _server_info_pre_swap
  delegate_to: localhost
  when: _current_boot | trim == "talos"

- name: "[Talos] Swap disks (Ubuntu first)"
  ops_frontier.provider.sakura_disk_swap:
    server_id: "{{ _server_info_pre_swap.server.id }}"
    disks: "{{ _server_info_pre_swap.server.disks }}"
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost
  when: _current_boot | trim == "talos"

- name: "[Talos] Power on with Ubuntu disk"
  ops_frontier.provider.sakura_server_power:
    server_id: "{{ _server_info_pre_swap.server.id }}"
    state: on
    timeout: 600
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost
  when: _current_boot | trim == "talos"

# ---------------------------------------------------------------
# 4. Ubuntu SSH 待機・ホスト鍵登録
# ---------------------------------------------------------------
- name: Scan Ubuntu SSH host key
  ansible.builtin.command:
    cmd: "ssh-keyscan -T 10 {{ ansible_host }}"
  register: _keyscan_ubuntu
  delegate_to: localhost
  until: _keyscan_ubuntu.rc == 0 and _keyscan_ubuntu.stdout | trim != ""
  retries: 30
  delay: 10

- name: Register Ubuntu host key
  ansible.builtin.shell:
    cmd: |
      ssh-keygen -R {{ ansible_host }} -f {{ known_hosts_path }} 2>/dev/null || true
      echo "{{ _keyscan_ubuntu.stdout }}" >> {{ known_hosts_path }}
      chmod 600 {{ known_hosts_path }}
  delegate_to: localhost
  changed_when: true

- name: Wait for Ubuntu SSH
  ansible.builtin.command:
    cmd: >
      ssh -i {{ ssh_key_path }}
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ known_hosts_path }}
      -o ConnectTimeout=10 -o BatchMode=yes
      {{ ubuntu_ssh_user }}@{{ ansible_host }} true
  delegate_to: localhost
  register: _ubuntu_ssh_wait
  until: _ubuntu_ssh_wait.rc == 0
  retries: 30
  delay: 10

# ---------------------------------------------------------------
# 5. Talos インストールイメージをノードごとに、対象 Ubuntu サーバ上の
#    omnictl (install_talos_deps role で導入済み) で直接ダウンロードし、
#    同じサーバ上でターゲットディスクに書き込む (localhost への delegate は
#    行わない)。ノードごとに一意のラベル (sakura.io/hostname) を付与し、
#    ステップ7 の Omni 登録確認でこのノードを一意に特定できるようにする。
#    SideroLink Join Config が組み込まれているため、起動するだけで Talos が
#    Omni に能動的に接続する。
#
#    さくらのクラウドのスイッチは DHCP を提供しない (Ubuntu 側も cloud-init
#    で固定IPを設定している) ため、Talos にも起動時点で固定IPを設定する
#    必要がある。Omni 接続 (SideroLink) 前なので machine config 経由の
#    設定は使えず、カーネルパラメータ ip= で起動時に設定する。
#    NOTE: eth0 = NIC0 (LB ルータ側/パブリック), eth1 = NIC1 (内部) という
#    Talos の legacy インターフェース命名を前提にしている。実機で異なる場合は
#    コンソールの F3 (Network Config) で実際のインターフェース名を確認して
#    修正すること。
# ---------------------------------------------------------------
- name: Compute static network settings for this node
  ansible.builtin.set_fact:
    _wan_netmask: "{{ ('0.0.0.0/' + tf_outputs.lb_netmask.value | string) | ansible.utils.ipaddr('netmask') }}"
    _internal_netmask: "{{ '0.0.0.0/24' | ansible.utils.ipaddr('netmask') }}"

- name: Set static network kernel args (ip= for eth0/eth1)
  ansible.builtin.set_fact:
    _talos_network_kernel_args:
      - "ip={{ tf_outputs.node_public_ips.value[inventory_hostname] }}::{{ tf_outputs.lb_gateway.value }}:{{ _wan_netmask }}:{{ inventory_hostname }}:eth0:off:8.8.8.8:1.1.1.1"
      - "ip={{ tf_outputs.node_private_ips.value[inventory_hostname] }}:::{{ _internal_netmask }}:{{ inventory_hostname }}:eth1:off"

- name: Download Talos install image for this node via omnictl
  ansible.builtin.command:
    cmd: >
      omnictl media download talos-install
      --format raw
      --initial-labels sakura.io/cluster={{ tf_outputs.omni_cluster_id.value }}
      --initial-labels sakura.io/hostname={{ inventory_hostname }}
      --extra-kernel-args "net.ifnames=0"
      --extra-kernel-args "{{ _talos_network_kernel_args[0] }}"
      --extra-kernel-args "{{ _talos_network_kernel_args[1] }}"
      --output /tmp/talos-install-{{ inventory_hostname }}.raw.xz
  environment:
    OMNI_ENDPOINT: "{{ tf_outputs.omni_endpoint.value }}"
    OMNI_SERVICE_ACCOUNT_KEY: "{{ lookup('env', 'OMNI_SERVICE_ACCOUNT_KEY') }}"
  # args:
  #   creates: "/tmp/talos-install-{{ inventory_hostname }}.raw.xz"
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: true

- name: Write Talos install image to target disk (may take several minutes)
  ansible.builtin.shell:
    cmd: |
      set -e -o pipefail
      xz -dc "/tmp/talos-install-{{ inventory_hostname }}.raw.xz" | sudo dd of=/dev/vdb bs=4M conv=fsync status=progress
    executable: /bin/bash
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: true
  async: 1800
  poll: 30

# ---------------------------------------------------------------
# 6. シャットダウン → ディスク順序入替え (Talos 先頭) → 起動
# ---------------------------------------------------------------
- name: Power off after writing Talos image
  ops_frontier.provider.sakura_server_power:
    server_id: "{{ _server_info.server.id }}"
    state: off
    timeout: 240
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost

- name: Refresh server info after install
  ops_frontier.provider.sakura_server_info:
    name: "{{ inventory_hostname }}"
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  register: _server_info
  delegate_to: localhost

- name: Swap disks (Talos first)
  ops_frontier.provider.sakura_disk_swap:
    server_id: "{{ _server_info.server.id }}"
    disks: "{{ _server_info.server.disks }}"
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost

- name: Power on with Talos disk
  ops_frontier.provider.sakura_server_power:
    server_id: "{{ _server_info.server.id }}"
    state: on
    timeout: 300
    api_base: "{{ sakura_api_base }}"
    token: "{{ sakura_access_token }}"
    secret: "{{ sakura_access_token_secret }}"
  delegate_to: localhost

# ---------------------------------------------------------------
# 7. Talos 起動確認
#    SSH は使用できないため、SideroLink 経由で Omni に登録されたことを
#    omnictl (localhost から) で確認する。sakura.io/hostname ラベルは
#    machine ではなく machinestatus リソースに付与されるため、
#    machinestatus を -l で検索してマシン ID を特定し、spec.connected
#    (Talos の stage は公開されていない) で接続を確認する。
# ---------------------------------------------------------------
- name: Get Omni machine ID for this node
  ansible.builtin.command:
    cmd: >
      omnictl get machinestatus
      -l sakura.io/hostname={{ inventory_hostname }}
      -o jsonpath='{.metadata.id}'
  environment:
    OMNI_ENDPOINT: "{{ tf_outputs.omni_endpoint.value }}"
    OMNI_SERVICE_ACCOUNT_KEY: "{{ lookup('env', 'OMNI_SERVICE_ACCOUNT_KEY') }}"
  register: _omni_machine
  delegate_to: localhost
  until: _omni_machine.rc == 0 and _omni_machine.stdout | trim != ""
  retries: 60
  delay: 10
  changed_when: false

- name: Wait for node to connect to Omni via SideroLink
  ansible.builtin.command:
    cmd: >
      omnictl get machinestatus
      -o jsonpath='{.spec.connected}'
      {{ _omni_machine.stdout | trim }}
  environment:
    OMNI_ENDPOINT: "{{ tf_outputs.omni_endpoint.value }}"
    OMNI_SERVICE_ACCOUNT_KEY: "{{ lookup('env', 'OMNI_SERVICE_ACCOUNT_KEY') }}"
  register: _omni_status
  delegate_to: localhost
  until: _omni_status.rc == 0 and 'true' in _omni_status.stdout
  retries: 60
  delay: 10
  changed_when: false

- name: Show completion
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: Talos Linux 起動確認 (Omni 登録済み) ✓"
