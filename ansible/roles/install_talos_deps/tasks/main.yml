---
# install_talos_deps role – Ubuntu サーバに公式 imager の実行環境をインストールする

- name: Install Docker, zstd, and the HWE kernel
  ansible.builtin.shell:
    cmd: |
      set -e
      echo nameserver 8.8.8.8 | sudo tee /etc/resolv.conf > /dev/null
      sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io zstd linux-generic-hwe-22.04
      sudo systemctl enable --now docker
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: true

- name: Read the running Ubuntu kernel
  ansible.builtin.command:
    cmd: uname -r
  register: _running_kernel
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: false

- name: Read the installed default Ubuntu kernel
  ansible.builtin.shell:
    cmd: basename "$(readlink -f /boot/vmlinuz)" | sed 's/^vmlinuz-//'
    executable: /bin/bash
  register: _default_kernel
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: false

- name: Reboot Ubuntu into the HWE kernel
  ansible.builtin.reboot:
    reboot_timeout: 1200
  become: true
  vars:
    ansible_user: "{{ ubuntu_ssh_user }}"
    ansible_ssh_private_key_file: "{{ ssh_key_path }}"
    ansible_python_interpreter: /usr/bin/python3
  when: _running_kernel.stdout | trim != _default_kernel.stdout | trim
