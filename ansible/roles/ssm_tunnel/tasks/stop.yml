---
# ssm_tunnel role (stop) – バックグラウンドで起動した SSM ポートフォワードセッションを停止する

- name: Check if tunnel pidfile exists
  ansible.builtin.stat:
    path: "{{ ssm_tunnel_pidfile }}"
  register: _ssm_tunnel_pidfile

- name: Stop SSM port-forwarding session (kill whole process group)
  ansible.builtin.command:
    cmd: "kill -- -{{ lookup('file', ssm_tunnel_pidfile) }}"
  when: _ssm_tunnel_pidfile.stat.exists
  failed_when: false
  changed_when: true

- name: Remove tunnel pidfile
  ansible.builtin.file:
    path: "{{ ssm_tunnel_pidfile }}"
    state: absent

- name: Remove tunnel logfile
  ansible.builtin.file:
    path: "{{ ssm_tunnel_logfile }}"
    state: absent
