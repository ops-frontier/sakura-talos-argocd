---
# omni_kubeconfig role – Sidero Talos Omni からクラスタの kubeconfig を取得する
#
# Talos Linux には SSH が存在しないため、以前のように SSM 経由で
# ノードから /etc/rancher/k3s/k3s.yaml を取得する方式は使用できない。
# 代わりに Omni の管理 API (omnictl) から直接 kubeconfig を取得する。
#
# NOTE: omnictl の具体的なサブコマンド/オプションは Omni のバージョンに
# 依存するため、以下は暫定実装である。実際の omnictl の仕様
# (omnictl kubeconfig --help 等) に合わせて調整すること。
#
# 呼び出し側は以下の変数を設定すること:
#   omni_kubeconfig_dest: kubeconfig の書き込み先パス

- name: Fetch kubeconfig from Omni
  ansible.builtin.command:
    cmd: >
      omnictl kubeconfig
      --cluster {{ tf_outputs.omni_cluster_id.value }}
      --service-account
      --user ansible
      --ttl 2h
      --merge=false
      --force
      {{ omni_kubeconfig_dest }}
  environment:
    OMNI_ENDPOINT: "{{ tf_outputs.omni_endpoint.value }}"
    OMNI_SERVICE_ACCOUNT_KEY: "{{ lookup('env', 'OMNI_SERVICE_ACCOUNT_KEY') }}"
  changed_when: true

- name: Restrict kubeconfig permissions
  ansible.builtin.file:
    path: "{{ omni_kubeconfig_dest }}"
    mode: "0600"
