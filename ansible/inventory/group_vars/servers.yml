---
# servers グループ共通の SSH 接続設定
# ansible_host は各 playbook の terraform_outputs role で動的に上書きされる
#
# Talos Linux には sshd が存在しないため、SSH 接続は Ubuntu
# ブートストラップディスク起動時 (build-infra / boot 内の一時的な処理) のみで
# 使用する。Talos 起動後のノードには SSH で一切接続しない。

ansible_python_interpreter: /usr/bin/python3

ansible_user: "{{ ubuntu_ssh_user }}"
ansible_ssh_private_key_file: "{{ ssh_key_path }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o UserKnownHostsFile={{ known_hosts_path }}
  -o ConnectTimeout=15
  -o ServerAliveInterval=30
  -o ServerAliveCountMax=10
  -o BatchMode=yes
